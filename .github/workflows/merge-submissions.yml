name: merge-submissions

# Submission flow: PRs add one campaign file under data/submissions/. On
# pull_request we validate every episode envelope and compute the metrics
# (status check); after merge to main we regenerate data/results.json from
# all submission files, commit, and request a Pages build.

on:
  push:
    branches: [main]
    paths: ["data/submissions/**", "data/ranges.json", "scripts/merge_submissions.py", ".github/workflows/merge-submissions.yml"]
  pull_request:
    paths: ["data/submissions/**", "data/ranges.json", "schemas/**", "scripts/merge_submissions.py", "scripts/build_submission.py", "scripts/test_merge_submissions.py", ".github/workflows/merge-submissions.yml"]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the schema-consistency test needs it; the merger itself is stdlib-only.
      - run: python -m pip install --quiet "jsonschema==4.26.0"
      - run: python -m unittest discover -s scripts -p test_merge_submissions.py
      - run: python scripts/merge_submissions.py --check

  merge:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pages: write
    concurrency:
      group: merge-submissions-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/merge_submissions.py
      - name: Commit merged results
        id: results
        run: |
          git config user.name  "greyzone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: merge campaign submissions [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
      - name: Publish updated results
        if: steps.results.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
